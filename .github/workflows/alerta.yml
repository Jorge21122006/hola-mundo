
name: Hola Mundo y notificacion ntfy

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Enviar notificacion a ntfy
        run: |
          curl --fail-with-body -sS \
            -H "Title: GitHub Actions - Hola Mundo" \
            -H "Tags: white_check_mark" \
            -d "Se han subido cambios a la rama main del repositorio hola-mundo. El flujo de GitHub Actions se ha ejecutado." \
            https://ntfy.sh/devops-itla
